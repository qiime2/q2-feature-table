package:
  name: q2-feature-table
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - pip
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - scikit-bio {{ scikit_bio }}
  - biom-format {{ biom_format }}
  - seaborn {{ seaborn }}
  - matplotlib {{ matplotlib }}
  - pandas {{ pandas }}
  - numpy {{ numpy }}
  - ipywidgets
  - qiime2 >={{ qiime2 }}
  - q2templates >={{ q2templates }}
  - q2-types >={{ q2_types }}
  - rnanorm {{ rnanorm }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - q2templates >={{ q2templates }}
  - q2-types >={{ q2_types }}
  - pytest
  # pinning at 4.43.0 temporarily because a bug was introduced in 4.44.0
  # that was causing test failures in summarize
  # issue XREF: https://github.com/SeleniumHQ/selenium/issues/17448
  - selenium=4.43.0
  imports:
  - q2_feature_table
  - qiime2.plugins.feature_table
  commands:
  - py.test --pyargs q2_feature_table
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
